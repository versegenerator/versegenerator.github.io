<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Versgenerator</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Next:ital,wght@0,200..800;1,200..800&family=EB+Garamond:ital,wght@0,400..800;1,400..800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="app">
    <div class="layout">
      <!-- Compact mobile toolbar - narrow viewports only (see the max-width:
           900px media query), replaces .side there entirely. Sits above the
           preview in normal document flow (pushes it down, never overlays
           it). Built mostly by main.js; the static markup here is just the
           row/group scaffolding. -->
      <div id="mobile-toolbar" class="mobile-toolbar">
        <div class="mobile-grid">
          <div id="mobile-ref-group" class="mobile-ref-group">
            <input id="mobile-reference-input" type="text" placeholder="e.g. John 3:16 or Psalm 23:1-6" aria-label="Verse reference" />
            <select id="mobile-translation-select" class="mobile-inline-select" aria-label="Translation">
              <option value="schlachter">Schlachter 2000</option>
              <option value="kjv">KJV</option>
            </select>
          </div>
          <div id="mobile-font-group"></div>
          <div id="mobile-theme-group"></div>
          <div id="mobile-textsize-group"></div>

          <div class="mobile-toolbar-divider"></div>

          <select id="mobile-aspect-select" class="mobile-aspect-select" aria-label="Aspect ratio"></select>
          <div id="mobile-source-group"></div>
          <div id="mobile-filter-group"></div>
          <div id="mobile-zoom-group"></div>
        </div>
      </div>

      <section class="preview-wrap">
        <div class="canvas-stage">
          <canvas id="preview-canvas"></canvas>
          <div id="grid-overlay" class="grid-overlay" aria-hidden="true"></div>
          <div id="wallpaper-safe-overlay" class="safe-zone-overlay" aria-hidden="true" hidden>
            <div class="safe-zone-band safe-zone-top"><span>Clock / status bar</span></div>
            <div class="safe-zone-band safe-zone-bottom"><span>Widgets / shortcuts / nav bar</span></div>
          </div>
          <p id="mobile-toast" class="mobile-toast" hidden></p>

          <!-- Positioned relative to the canvas stage (straddling its
               bottom edge), not the viewport - so it always sits half over
               the image itself regardless of how much content (photo
               credit, customize-quote panel) follows below it. -->
          <div id="mobile-save" class="mobile-save">
            <button id="mobile-save-btn" type="button" class="mobile-save-btn"><span id="mobile-save-label"></span></button>
            <button id="mobile-save-dropdown-btn" type="button" class="mobile-save-dropdown-btn" aria-haspopup="true" aria-expanded="false" aria-label="More save options"></button>
            <div id="mobile-save-menu" class="mobile-save-menu" hidden></div>
          </div>
        </div>
        <p id="photo-credit" class="credit" hidden></p>
        <button id="customize-quote-toggle" type="button" class="credit-link">Customize quote</button>
        <div id="customize-quote-panel" class="customize-quote-panel" hidden>
          <label for="customize-quote-text">Quote</label>
          <textarea id="customize-quote-text" rows="5"></textarea>
          <label for="customize-quote-source">Source</label>
          <input id="customize-quote-source" type="text" />
          <!-- Only shown once the quote/source above is customized (see
               updateCreditField in main.js) - lets a pasted-in different
               translation's text have its Schlachter attribution fixed or
               removed. Photo credit is separate and never editable. -->
          <div id="customize-credit-row" class="customize-credit-row" hidden>
            <label for="customize-quote-credit">Bible credit</label>
            <input id="customize-quote-credit" type="text" />
          </div>
        </div>
        <input id="upload-input" type="file" accept="image/*" hidden />
      </section>

      <div class="side">
        <button id="panel-toggle" type="button" class="link-button">Hide settings</button>

        <div id="panel-content">
        <section class="controls">
          <div class="control-row">
            <input id="reference-input" type="text" placeholder="e.g. John 3:16 or Psalm 23:1-6" />
          </div>
          <div class="control-row">
            <select id="translation-select">
              <option value="schlachter">Schlachter 2000</option>
              <option value="kjv">KJV</option>
            </select>
          </div>
          <p id="reference-error" class="error" hidden></p>

          <div class="control-divider"></div>

          <div class="control-row">
            <div id="font-buttons" class="toggle-group"></div>
          </div>

          <div class="control-row control-col">
            <label for="text-size-slider">Text size</label>
            <input id="text-size-slider" type="range" min="20" max="160" value="100" />
          </div>

          <div class="control-row">
            <div id="text-theme-buttons" class="toggle-group"></div>
          </div>

          <div class="control-divider"></div>

          <div class="control-row">
            <select id="aspect-select" aria-label="Aspect ratio"></select>
          </div>

          <div class="control-divider"></div>

          <div class="control-row">
            <div id="source-buttons" class="toggle-group"></div>
          </div>
          <p id="photo-error" class="error" hidden></p>

          <div class="control-row control-col">
            <label for="zoom-slider">Zoom</label>
            <input id="zoom-slider" type="range" min="100" max="300" value="100" />
          </div>

          <div class="control-row">
            <div id="filter-buttons" class="toggle-group"></div>
          </div>
        </section>

        <div class="control-divider"></div>

        <section id="save-standard" class="save-row save-col">
          <button id="save-standard-btn" type="button">
            <svg class="icon-download" viewBox="0 0 16 16" width="14" height="14" aria-hidden="true"><path d="M8 1v8m0 0L4.5 5.5M8 9l3.5-3.5M2 12.5h12" stroke="currentColor" stroke-width="1.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
            Save
          </button>
          <button id="save-highres-btn" type="button" class="link-button">
            <svg class="icon-download" viewBox="0 0 16 16" width="14" height="14" aria-hidden="true"><path d="M8 1v8m0 0L4.5 5.5M8 9l3.5-3.5M2 12.5h12" stroke="currentColor" stroke-width="1.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
            save high resolution version
          </button>
        </section>
        <section id="save-wide" class="save-row" hidden>
          <button id="save-hd-btn" type="button">
            <svg class="icon-download" viewBox="0 0 16 16" width="14" height="14" aria-hidden="true"><path d="M8 1v8m0 0L4.5 5.5M8 9l3.5-3.5M2 12.5h12" stroke="currentColor" stroke-width="1.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
            Save HD
          </button>
          <button id="save-4k-btn" type="button">
            <svg class="icon-download" viewBox="0 0 16 16" width="14" height="14" aria-hidden="true"><path d="M8 1v8m0 0L4.5 5.5M8 9l3.5-3.5M2 12.5h12" stroke="currentColor" stroke-width="1.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
            Save 4K
          </button>
        </section>
        </div>
      </div>
    </div>
  </div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
